# CI is scripts/check.sh, section by section, so a green run locally is a
# green run here by construction. CONTRIBUTING.md explains why.
name: ci

on:
  push:
    branches: [main, saas-console]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TERM: dumb

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: scripts/check.sh rust
      - name: Release binaries (simulator)
        run: cargo build --release --manifest-path rust/Cargo.toml -p canton-sim -p canton-sim-server
      - uses: actions/upload-artifact@v4
        with:
          name: canton-sim-linux-x86_64
          path: |
            rust/target/release/canton-sim
            rust/target/release/canton-sim-server

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/check.sh ts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/check.sh web

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/check.sh audit

  # The self-host path is `docker compose up --build`; build the three images
  # the way compose does so a Dockerfile that drifts from the workspace fails
  # here, not on an operator's machine. The buildx cache keeps the Rust
  # builds from starting cold on every run.
  docker:
    runs-on: ubuntu-latest
    services:
      # For the migration check below: the console image must apply its
      # migrations to a real Postgres and come up healthy, the way it does on
      # an operator's machine.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canton
          POSTGRES_PASSWORD: canton
          POSTGRES_DB: canton
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canton -d canton"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Signing service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/solvency-service/Dockerfile
          push: false
          tags: canton-assurance-service:ci
          cache-from: type=gha,scope=service
          cache-to: type=gha,scope=service,mode=max
      - name: Simulator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/sim-server/Dockerfile
          push: false
          tags: canton-sim:ci
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,scope=simulator,mode=max
      - name: Console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: canton-assurance-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Console refuses to start unconfigured
        # The config check must reject an empty environment in production
        # with a readable message rather than serving a broken site.
        run: |
          set +e
          out=$(docker run --rm -e SKIP_MIGRATIONS=1 canton-assurance-web:ci 2>&1)
          code=$?
          echo "$out" | tail -20
          echo "exit: $code"
          echo "$out" | grep -q "\[config\] error: AUTH_SECRET" && [ "$code" -ne 0 ]
      - name: Console applies migrations and comes up
        # The entrypoint runs `prisma migrate deploy` before the server; a
        # Prisma CLI missing part of its dependency closure crash-looped here
        # once. The signing service is absent, so /api/health is 503, but the
        # body must say the database is fine and the server must be answering.
        run: |
          docker run -d --name web --network host \
            -e DATABASE_URL=postgresql://canton:canton@127.0.0.1:5432/canton \
            -e AUTH_SECRET=$(head -c 48 /dev/zero | tr '\0' 'a') \
            -e AUTH_URL=http://127.0.0.1:3000 \
            -e SERVICE_URL=http://127.0.0.1:8790 \
            -e SERVICE_TOKEN=$(head -c 40 /dev/zero | tr '\0' 'b') \
            -e MAGIC_LINK_LOG=1 \
            canton-assurance-web:ci
          for i in $(seq 1 60); do
            body=$(curl -s http://127.0.0.1:3000/api/health || true)
            echo "$body" | grep -q '"db":"ok"' && break
            sleep 2
          done
          docker logs web
          echo "$body"
          echo "$body" | grep -q '"db":"ok"'
          docker logs web 2>&1 | grep -qi "migration" 
          docker rm -f web
      - name: Compose file is valid
        env:
          POSTGRES_PASSWORD: x
          SERVICE_TOKEN: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          SERVICE_KEK: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          CANTON_SIM_LEDGER_URL: http://participant.example/api/json-api
        run: docker compose --profile simulator config --quiet

  daml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Daml SDK
        # The version here must match daml/solvency-anchor/daml.yaml; a test
        # in rust/solvency-report reads both and fails when they differ. The
        # installer takes the version as a positional argument.
        run: |
          version=2.10.4
          curl -sSL https://get.daml.com/ | sh -s "$version"
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"
      - run: scripts/check.sh daml
