[workspace]
resolver = "2"
members = [
    "crates/canton-sim-proto",
    "crates/canton-sim-diagnose",
    "crates/canton-sim-fee",
    "crates/canton-sim-core",
    "cli/canton-sim",
    "server/canton-sim-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Rocky-DEX/Rocky.simulator"
publish = false

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rust_decimal = { version = "1.36", features = ["serde-str"] }
regex = "1"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protox = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
